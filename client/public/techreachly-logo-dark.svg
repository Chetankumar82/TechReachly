<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="reachGradientDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="45%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="pulseWaveDark" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.1"/>
      <stop offset="60%" stop-color="#06B6D4" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="textGradDark" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#A78BFA"/>
      <stop offset="100%" stop-color="#22D3EE"/>
    </linearGradient>
    <filter id="aiGlow" x="-20%" y="-20%" width="150%" height="150%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background Dark Container -->
  <rect width="520" height="120" rx="16" fill="#0B1326"/>
  <rect width="520" height="120" rx="16" stroke="#1E293B" stroke-width="1.5"/>

  <!-- Logo Mark Group -->
  <g transform="translate(24, 18)">
    <!-- Radar / AI Wave Rings -->
    <circle cx="42" cy="42" r="34" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="M 18 64 A 32 32 0 0 1 66 18" stroke="url(#pulseWaveDark)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 66 A 22 22 0 0 1 64 30" stroke="#06B6D4" stroke-width="2" stroke-linecap="round" opacity="0.75"/>

    <!-- Dynamic Upward Reach Arrow Geometry -->
    <path d="M 20 62 L 64 16 L 48 68 L 38 46 Z" fill="url(#reachGradientDark)" filter="url(#aiGlow)"/>
    <path d="M 64 16 L 38 46 L 50 44 Z" fill="#4338CA" opacity="0.9"/>
    <path d="M 20 62 L 38 46 L 32 54 Z" fill="#1E1B4B" opacity="0.9"/>

    <!-- AI Star Spark at apex -->
    <path d="M 64 10 Q 64 16, 70 16 Q 64 16, 64 22 Q 64 16, 58 16 Q 64 16, 64 10 Z" fill="#22D3EE"/>
    <circle cx="64" cy="16" r="1.5" fill="#FFFFFF"/>
    <!-- Trajectory impulse dot -->
    <circle cx="20" cy="62" r="2.5" fill="#06B6D4"/>
    <circle cx="28" cy="68" r="1.5" fill="#7C3AED"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(126, 68)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.035em" fill="#F8FAFC">
      Tech<tspan fill="url(#textGradDark)">Reach</tspan><tspan fill="#94A3B8" font-weight="500">ly</tspan>
    </text>
  </g>

  <!-- Tagline / Badge -->
  <g transform="translate(406, 48)">
    <rect width="86" height="24" rx="12" fill="#1E1B4B" stroke="#4F46E5" stroke-width="1"/>
    <text x="43" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#38BDF8" text-anchor="middle" letter-spacing="0.06em">AI PULSE</text>
  </g>
</svg>