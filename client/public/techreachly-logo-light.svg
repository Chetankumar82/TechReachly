<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 120" width="520" height="120" fill="none">
  <defs>
    <linearGradient id="reachGradientLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4338CA"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <linearGradient id="pulseWaveLight" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6D28D9" stop-opacity="0.15"/>
      <stop offset="60%" stop-color="#0284C7" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#0EA5E9" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="textGradLight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#0284C7"/>
    </linearGradient>
    <filter id="subtleShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#4338CA" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Light Canvas Container -->
  <rect width="520" height="120" rx="16" fill="#FFFFFF"/>
  <rect width="520" height="120" rx="16" stroke="#E2E8F0" stroke-width="1.5"/>

  <!-- Logo Mark Group -->
  <g transform="translate(24, 18)">
    <!-- Radar / AI Wave Rings -->
    <circle cx="42" cy="42" r="34" stroke="#E2E8F0" stroke-width="1.5" stroke-dasharray="3 4"/>
    <path d="M 18 64 A 32 32 0 0 1 66 18" stroke="url(#pulseWaveLight)" stroke-width="2.5" stroke-linecap="round"/>
    <path d="M 28 66 A 22 22 0 0 1 64 30" stroke="#0284C7" stroke-width="2" stroke-linecap="round" opacity="0.8"/>

    <!-- Dynamic Upward Reach Arrow Geometry -->
    <path d="M 20 62 L 64 16 L 48 68 L 38 46 Z" fill="url(#reachGradientLight)" filter="url(#subtleShadow)"/>
    <path d="M 64 16 L 38 46 L 50 44 Z" fill="#312E81" opacity="0.85"/>
    <path d="M 20 62 L 38 46 L 32 54 Z" fill="#1E1B4B" opacity="0.9"/>

    <!-- AI Star Spark at apex -->
    <path d="M 64 10 Q 64 16, 70 16 Q 64 16, 64 22 Q 64 16, 58 16 Q 64 16, 64 10 Z" fill="#0284C7"/>
    <circle cx="64" cy="16" r="1.5" fill="#FFFFFF"/>
    <!-- Trajectory impulse dot -->
    <circle cx="20" cy="62" r="2.5" fill="#0284C7"/>
    <circle cx="28" cy="68" r="1.5" fill="#6D28D9"/>
  </g>

  <!-- Brand Typography -->
  <g transform="translate(126, 68)">
    <text font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="34" font-weight="800" letter-spacing="-0.035em" fill="#0F172A">
      Tech<tspan fill="url(#textGradLight)">Reach</tspan><tspan fill="#475569" font-weight="500">ly</tspan>
    </text>
  </g>

  <!-- Tagline / Badge -->
  <g transform="translate(406, 48)">
    <rect width="86" height="24" rx="12" fill="#EEF2FF" stroke="#C7D2FE" stroke-width="1"/>
    <text x="43" y="16" font-family="'Plus Jakarta Sans', sans-serif" font-size="10.5" font-weight="700" fill="#4F46E5" text-anchor="middle" letter-spacing="0.06em">AI PULSE</text>
  </g>
</svg>