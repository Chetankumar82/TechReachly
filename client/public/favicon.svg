<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" fill="none">
  <defs>
    <linearGradient id="squircleBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="50%" stop-color="#0B1326"/>
      <stop offset="100%" stop-color="#060E20"/>
    </linearGradient>
    <linearGradient id="arrowGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="40%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="ringGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7C3AED" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#06B6D4" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <filter id="iconGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="glassBorder" x="-5%" y="-5%" width="110%" height="110%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Continuous Curvature macOS Squircle Canvas -->
  <rect x="8" y="8" width="240" height="240" rx="54" fill="url(#squircleBg)" filter="url(#glassBorder)"/>
  <rect x="8" y="8" width="240" height="240" rx="54" stroke="#334155" stroke-width="2" stroke-opacity="0.6"/>
  <!-- Inner Glass Accent Ring -->
  <rect x="12" y="12" width="232" height="232" rx="50" stroke="#FFFFFF" stroke-width="1" stroke-opacity="0.08"/>

  <!-- Radar & Radial AI Pulse Grid -->
  <g transform="translate(128, 128)">
    <circle cx="0" cy="0" r="82" stroke="#1E293B" stroke-width="1.5" stroke-dasharray="4 6" opacity="0.7"/>
    <circle cx="0" cy="0" r="54" stroke="#334155" stroke-width="1.5" stroke-dasharray="3 5" opacity="0.5"/>

    <!-- Pulse Wave Arcs -->
    <path d="M -56 50 A 75 75 0 0 1 54 -52" stroke="url(#ringGrad)" stroke-width="4" stroke-linecap="round"/>
    <path d="M -34 54 A 54 54 0 0 1 52 -24" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
    <path d="M -16 56 A 34 34 0 0 1 48 2" stroke="#7C3AED" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>

    <!-- Upward Reach Dynamic Arrow Geometry -->
    <g transform="translate(-10, 4)">
      <!-- Drop ambient glow -->
      <path d="M -44 48 L 52 -48 L 22 56 L 0 10 Z" fill="url(#arrowGrad)" filter="url(#iconGlow)"/>
      <path d="M 52 -48 L 0 10 L 25 6 Z" fill="#312E81" opacity="0.85"/>
      <path d="M -44 48 L 0 10 L -12 26 Z" fill="#1E1B4B" opacity="0.95"/>

      <!-- AI Apex Star Spark -->
      <path d="M 52 -60 Q 52 -48, 64 -48 Q 52 -48, 52 -36 Q 52 -48, 40 -48 Q 52 -48, 52 -60 Z" fill="#22D3EE"/>
      <circle cx="52" cy="-48" r="2.5" fill="#FFFFFF"/>

      <!-- Trajectory Micro-nodes -->
      <circle cx="-44" cy="48" r="4.5" fill="#06B6D4"/>
      <circle cx="-28" cy="58" r="3" fill="#7C3AED"/>
      <circle cx="22" cy="56" r="3.5" fill="#38BDF8"/>
    </g>
  </g>
</svg>